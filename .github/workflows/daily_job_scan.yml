name: Daily Job Scan

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 03:30 UTC / 09:00 India time.
    - cron: "30 3 * * *"
    # Runs daily at 12:30 UTC / 18:00 India time.
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run scanner
        run: python scan_jobs.py

      - name: Upload daily outputs
        uses: actions/upload-artifact@v4
        with:
          name: job-scan-${{ github.run_number }}
          path: |
            outputs/*.xlsx
            outputs/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Send Telegram report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python send_telegram.py

      - name: Commit updated job history
        if: always()
        run: |
          if [ -f outputs/job_history.xlsx ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add outputs/job_history.xlsx
            git diff --cached --quiet || git commit -m "Update job history"
            git push
          fi
